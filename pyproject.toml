[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisy"
version = "0.1.0"
description = "Streaming colored-noise audio generator with optional black-video muxing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
noisy = "noisy.cli:main"

[tool.setuptools]
packages = ["noisy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
